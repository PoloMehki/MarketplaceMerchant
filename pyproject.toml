[project]
name = "negagent"
version = "0.1.0"
description = "Buyer-focused human-in-the-loop Facebook Marketplace negotiation agent (CascadiaJS hackathon)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "boto3>=1.34",           # Bedrock (0.2)
    "apify-client>=1.6",     # Apify actors (2.1, 3.1)
    "boxsdk>=3.9,<4.0",      # Box archival (7.1) — v10 renamed the module
    "strands-agents",        # Dev B: Strands agent (6.2)
    "strands-agents-tools",  # Dev B: Strands tools
    "mcp",                   # Dev B: Playwright MCP (0.3)
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/negagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
